<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Sites — Meritton British International School</title>
<script src="courses-config.js"></script>
<style>
  :root { --navy: #1B2B5E; --teal: #0D9488; --teal-light: #e6f7f5; --navy-light: #eef0f8; }
  * { box-sizing: border-box; }
  body {
    font-family: Calibri, Arial, sans-serif;
    color: #1a1a1a;
    margin: 0;
    background: #fbfbfa;
    line-height: 1.55;
  }
  h1, h2 {
    font-family: 'Bookman Old Style', Cambria, Georgia, serif;
    color: var(--navy);
    margin: 0;
  }
  header {
    background: var(--navy);
    color: white;
    padding: 54px 24px 44px;
    text-align: center;
    border-bottom: 6px solid var(--teal);
  }
  header .banner {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
  header h1 { color: white; font-size: 32px; }
  header p {
    max-width: 620px;
    margin: 14px auto 0;
    color: #cfd7ee;
    font-size: 16px;
  }

  main { max-width: 920px; margin: 0 auto; padding: 46px 24px 100px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  a.course-card {
    display: block;
    background: white;
    border: 1px solid #e2e2e2;
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: inherit;
    transition: box-shadow 0.15s, transform 0.15s;
  }
  a.course-card:hover {
    box-shadow: 0 6px 20px rgba(27,43,94,0.10);
    transform: translateY(-2px);
    border-color: var(--teal);
  }
  .course-card h2 {
    font-size: 18px;
    margin-bottom: 8px;
  }
  .course-card p {
    color: #666;
    font-size: 13.5px;
    margin: 0 0 14px;
    min-height: 40px;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 0.2px;
  }
  .badge.active { background: var(--teal-light); color: var(--teal); }
  .badge.coming-soon { background: #f2f2f2; color: #999; }

  footer {
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 30px 20px 50px;
  }
</style>
</head>
<body>

<header>
  <span class="banner">Meritton British International School</span>
  <h1>Course Lesson Sites</h1>
  <p>A directory of every course's lesson library. Choose a course below to see its full set of lessons.</p>
</header>

<main>
  <div class="grid" id="courseGrid"></div>
</main>

<footer>
  Meritton British International School
</footer>

<script>
(function() {
  var courses = window.COURSES_CONFIG || [];
  var grid = document.getElementById('courseGrid');

  courses.forEach(function(course) {
    var a = document.createElement('a');
    a.className = 'course-card';
    a.href = course.path + 'index.html';

    var h2 = document.createElement('h2');
    h2.textContent = course.title;

    var p = document.createElement('p');
    p.textContent = course.description || '';

    var badge = document.createElement('span');
    var isActive = course.status === 'active';
    badge.className = 'badge ' + (isActive ? 'active' : 'coming-soon');
    badge.textContent = isActive ? 'Active' : 'Coming Soon';

    a.appendChild(h2);
    a.appendChild(p);
    a.appendChild(badge);
    grid.appendChild(a);
  });
})();
</script>

</body>
</html>
