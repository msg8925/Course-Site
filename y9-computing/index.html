<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Library — Y9 — Computing (Cambridge Lower Secondary)</title>
<script src="site-structure.js"></script>
<script src="lessons-config.js"></script>
<style>
  :root {
    --navy: #1B2B5E;
    --teal: #0D9488;
    --teal-light: #e6f7f5;
    --navy-light: #eef0f8;
    --amber: #d9a300;
  }
  * { box-sizing: border-box; }
  body {
    font-family: Calibri, Arial, sans-serif;
    color: #1a1a1a;
    margin: 0;
    background: #fbfbfa;
    line-height: 1.55;
  }
  h1, h2, h3 {
    font-family: 'Bookman Old Style', Cambria, Georgia, serif;
    color: var(--navy);
    margin: 0;
  }

  header {
    background: var(--navy);
    color: white;
    padding: 46px 24px 40px;
    text-align: center;
    border-bottom: 6px solid var(--teal);
  }
  header .banner {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 13px;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
  }
  header h1 { color: white; font-size: 34px; }
  header p {
    max-width: 640px;
    margin: 14px auto 0;
    color: #cfd7ee;
    font-size: 16px;
  }
  header .progress {
    margin-top: 18px;
    font-size: 13px;
    color: #9db3e0;
  }

  nav.sectionnav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: white;
    border-bottom: 1px solid #e2e2e2;
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 10px 12px;
    flex-wrap: wrap;
  }
  nav.sectionnav a {
    color: var(--navy);
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    padding: 8px 14px;
    border-radius: 6px;
  }
  nav.sectionnav a:hover { background: var(--navy-light); }

  main {
    max-width: 920px;
    margin: 0 auto;
    padding: 10px 24px 100px;
  }

  section.unit {
    margin-top: 56px;
    scroll-margin-top: 60px;
  }
  section.unit .unit-head {
    display: flex;
    align-items: baseline;
    gap: 14px;
    border-bottom: 3px solid var(--teal);
    padding-bottom: 10px;
    margin-bottom: 6px;
  }
  section.unit .unit-num {
    font-family: 'Bookman Old Style', Cambria, Georgia, serif;
    font-size: 15px;
    color: var(--teal);
    font-weight: bold;
  }
  section.unit h2 { font-size: 25px; }
  section.unit .unit-desc {
    color: #555;
    font-size: 15px;
    margin: 8px 0 20px;
    max-width: 640px;
  }

  .subsection { margin: 26px 0 10px; }
  .subsection h3 {
    font-size: 17px;
    color: var(--navy);
    margin-bottom: 4px;
  }
  .subsection .sub-desc {
    color: #666;
    font-size: 13.5px;
    margin: 0 0 10px;
  }

  ul.lesson-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e2e2e2;
  }
  ul.lesson-list li.lesson-item {
    background: white;
    border-bottom: 1px solid #eee;
    font-size: 15px;
  }
  ul.lesson-list li.lesson-item:last-child { border-bottom: none; }
  .lesson-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: bold;
    color: var(--navy);
  }
  .lesson-row-header:hover { background: var(--teal-light); }
  .expand-icon {
    display: inline-block;
    width: 16px;
    text-align: center;
    color: var(--teal);
    font-weight: bold;
    margin-right: 2px;
  }
  .tag {
    font-size: 11px;
    font-weight: bold;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
    letter-spacing: 0.2px;
    flex-shrink: 0;
  }
  .tag.ready { background: var(--teal-light); color: var(--teal); }
  .tag.planned { background: #f2f2f2; color: #999; }
  li.locked-row .lesson-row-header { color: #777; }
  li.locked-row .lesson-row-header:hover { background: #fafafa; }
  .resource-list {
    display: none;
    padding: 0 18px 12px 46px;
    background: #fafafa;
  }
  .resource-list.open { display: block; }
  .resource-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-top: 1px dashed #e2e2e2;
    font-size: 13.5px;
  }
  .resource-item a {
    color: var(--navy);
    text-decoration: none;
  }
  .resource-item a:hover { text-decoration: underline; }
  .resource-item.locked a { color: #999; }
  .no-resources {
    color: #999;
    font-size: 13px;
    padding: 10px 0;
    font-style: italic;
  }

  footer {
    text-align: center;
    color: #888;
    font-size: 13px;
    padding: 30px 20px 50px;
  }
</style>
</head>
<body>

<header>
  <span class="banner">Computer Science Lesson Library</span>
  <h1>Y9 — Computing (Cambridge Lower Secondary)</h1>
  <p>Every lesson from Y9 Computing, in one place. Work through a topic in order, or jump straight to this week's lesson.</p>
  <p class="progress" id="progressLine"></p>
</header>

<nav class="sectionnav" id="sectionNav"></nav>

<main id="mainContent"></main>

<footer>
  Y9 — Computing (Cambridge Lower Secondary)
</footer>

<script>
(function() {
  var structure = (window.SITE_STRUCTURE && window.SITE_STRUCTURE.sections) || [];
  var status = window.LESSON_STATUS || {};

  var nav = document.getElementById('sectionNav');
  var main = document.getElementById('mainContent');

  var totalLessons = 0, unlockedLessons = 0;

  structure.forEach(function(section) {
    var navLink = document.createElement('a');
    navLink.href = '#' + section.id;
    navLink.textContent = section.number + '. ' + section.title.split(':')[0];
    nav.appendChild(navLink);

    var sec = document.createElement('section');
    sec.className = 'unit';
    sec.id = section.id;

    var head = document.createElement('div');
    head.className = 'unit-head';
    var num = document.createElement('span');
    num.className = 'unit-num';
    num.textContent = 'SECTION ' + section.number;
    var h2 = document.createElement('h2');
    h2.textContent = section.title;
    head.appendChild(num);
    head.appendChild(h2);
    sec.appendChild(head);

    if (section.description) {
      var desc = document.createElement('p');
      desc.className = 'unit-desc';
      desc.textContent = section.description;
      sec.appendChild(desc);
    }

    (section.subsections || []).forEach(function(sub) {
      var target = sec;
      var subWrap = null;
      if (sub.title) {
        subWrap = document.createElement('div');
        subWrap.className = 'subsection';
        var h3 = document.createElement('h3');
        h3.textContent = sub.title;
        subWrap.appendChild(h3);
        if (sub.description) {
          var subDesc = document.createElement('p');
          subDesc.className = 'sub-desc';
          subDesc.textContent = sub.description;
          subWrap.appendChild(subDesc);
        }
        target = subWrap;
      }

      var ul = document.createElement('ul');
      ul.className = 'lesson-list';

      (sub.lessons || []).forEach(function(lesson) {
        totalLessons++;
        var isUnlocked = status[lesson.key] === 'unlocked';
        if (isUnlocked) unlockedLessons++;

        var li = document.createElement('li');
        li.className = 'lesson-item' + (isUnlocked ? '' : ' locked-row');

        var rowHeader = document.createElement('div');
        rowHeader.className = 'lesson-row-header';

        var leftPart = document.createElement('span');
        var expandIcon = document.createElement('span');
        expandIcon.className = 'expand-icon';
        expandIcon.textContent = '+';
        leftPart.appendChild(expandIcon);
        leftPart.appendChild(document.createTextNode('\u00A0' + lesson.label + '\u00A0\u00A0' + lesson.title));

        var tag = document.createElement('span');
        tag.className = isUnlocked ? 'tag ready' : 'tag planned';
        tag.textContent = isUnlocked ? 'Unlocked' : 'Locked';

        rowHeader.appendChild(leftPart);
        rowHeader.appendChild(tag);

        var resourceList = document.createElement('div');
        resourceList.className = 'resource-list';

        var resources = lesson.resources || [];
        if (resources.length === 0) {
          var none = document.createElement('div');
          none.className = 'no-resources';
          none.textContent = 'No content added yet.';
          resourceList.appendChild(none);
        } else {
          resources.forEach(function(res) {
            var item = document.createElement('div');
            item.className = 'resource-item' + (isUnlocked ? '' : ' locked');
            var a = document.createElement('a');
            a.href = res.href;
            a.textContent = res.title;
            if (!isUnlocked) {
              a.addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'locked.html?title=' + encodeURIComponent(lesson.label + ' ' + lesson.title + ' \u2014 ' + res.title);
              });
            }
            item.appendChild(a);
            resourceList.appendChild(item);
          });
        }

        rowHeader.addEventListener('click', function() {
          var isOpen = resourceList.classList.toggle('open');
          expandIcon.textContent = isOpen ? '\u2212' : '+';
        });

        li.appendChild(rowHeader);
        li.appendChild(resourceList);
        ul.appendChild(li);
      });

      target.appendChild(ul);
      if (subWrap) sec.appendChild(subWrap);
    });

    main.appendChild(sec);
  });

  document.getElementById('progressLine').textContent =
    unlockedLessons + ' of ' + totalLessons + ' lessons currently unlocked';
})();
</script>

</body>
</html>
